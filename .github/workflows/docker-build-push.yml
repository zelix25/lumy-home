name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0 or v1.0.0-beta)'
        required: true
        type: string

env:
  DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  DOCKER_REGISTRY: hub.nod-app.com

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version-from-tag.outputs.version || steps.set-version-from-dispatch.outputs.version }}
      is-beta: ${{ steps.set-version-from-tag.outputs.is-beta || steps.set-version-from-dispatch.outputs.is-beta }}
      image-tag: ${{ steps.set-version-from-tag.outputs.image-tag || steps.set-version-from-dispatch.outputs.image-tag }}
      tag: ${{ steps.set-version-from-tag.outputs.tag || steps.set-version-from-dispatch.outputs.tag }}
    steps:
      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: set-version-from-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          
          if [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            IS_BETA="true"
            IMAGE_TAG="beta"
          else
            IS_BETA="false"
            IMAGE_TAG="stable"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is-beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION"
          echo "Is Beta: $IS_BETA"
          echo "Image Tag: $IMAGE_TAG"
          echo "Full Tag: $TAG"

      - name: Set version from workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        id: set-version-from-dispatch
        run: |
          VERSION=${{ github.event.inputs.version }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          
          if [[ "${{ github.event.inputs.version }}" == *"-beta"* ]] || [[ "${{ github.event.inputs.version }}" == *"-alpha"* ]] || [[ "${{ github.event.inputs.version }}" == *"-rc"* ]]; then
            IS_BETA="true"
            IMAGE_TAG="beta"
          else
            IS_BETA="false"
            IMAGE_TAG="stable"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is-beta=$IS_BETA" >> $GITHUB_OUTPUT
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION"
          echo "Is Beta: $IS_BETA"
          echo "Image Tag: $IMAGE_TAG"
          echo "Full Tag: ${{ github.event.inputs.version }}"

  build-and-push-backend:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-backend
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}-${{ needs.determine-version.outputs.version }}
            type=raw,value=${{ needs.determine-version.outputs.tag }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-backend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-backend:buildcache,mode=max
          build-args: |
            VERSION=${{ needs.determine-version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}

  build-and-push-frontend:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-frontend
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}-${{ needs.determine-version.outputs.version }}
            type=raw,value=${{ needs.determine-version.outputs.tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-frontend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-frontend:buildcache,mode=max
          build-args: |
            VERSION=${{ needs.determine-version.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}

  summary:
    needs: [determine-version, build-and-push-backend, build-and-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Create summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.determine-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Full Tag**: ${{ needs.determine-version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ needs.determine-version.outputs.is-beta == 'true' && 'Beta' || 'Stable' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ needs.determine-version.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Images" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-backend:${{ needs.determine-version.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: \`${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REGISTRY_USERNAME }}/nodapp-frontend:${{ needs.determine-version.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### All Tags" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.determine-version.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.determine-version.outputs.image-tag }}-${{ needs.determine-version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ needs.determine-version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

