name: Build and Push Docker Images

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0 or v1.0.0-beta)"
        required: true
        type: string

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  check-tag-on-master:
    runs-on: ubuntu-latest
    outputs:
      is-on-master: ${{ steps.check.outputs.is-on-master }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Récupérer tout l'historique pour vérifier les branches
      
      - name: Check if tag is on master branch
        id: check
        run: |
          set -euo pipefail
          
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Pour workflow_dispatch, on accepte (l'utilisateur doit s'assurer d'être sur master)
            echo "is-on-master=true" >> "$GITHUB_OUTPUT"
            echo "✅ Workflow dispatch - assuming master branch"
          else
            # Pour les tags, vérifier que le commit du tag est sur master
            TAG_NAME="${{ github.ref_name }}"
            TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
            
            # Vérifier si le commit est sur master
            if git branch -r --contains "$TAG_COMMIT" | grep -q "origin/master"; then
              echo "is-on-master=true" >> "$GITHUB_OUTPUT"
              echo "✅ Tag $TAG_NAME points to a commit on master branch"
            else
              echo "is-on-master=false" >> "$GITHUB_OUTPUT"
              echo "❌ Tag $TAG_NAME does not point to a commit on master branch"
              echo "Available branches containing this commit:"
              git branch -r --contains "$TAG_COMMIT" || echo "None"
            fi
          fi

  determine-version:
    needs: check-tag-on-master
    if: needs.check-tag-on-master.outputs.is-on-master == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      image-tag: ${{ steps.out.outputs.image_tag }}
      is-beta: ${{ steps.out.outputs.is_beta }}
    steps:
      - name: Determine version
        id: out
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          # Normalize (strip leading v)
          IMAGE_TAG="${VERSION#v}"

          # Détecter si c'est une version beta/alpha/rc
          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            IS_BETA="true"
          else
            IS_BETA="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"

          echo "✅ VERSION=$VERSION"
          echo "✅ IMAGE_TAG=$IMAGE_TAG"
          echo "✅ IS_BETA=$IS_BETA"

  build-and-push-backend:
    needs: determine-version
    if: needs.determine-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Utiliser le tag (vérifié qu'il pointe vers master)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-backend
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}
          labels: |
            org.opencontainers.image.title=lumy-home-backend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/lumy-home-backend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/lumy-home-backend:buildcache,mode=max

      - name: Tag as latest (stable only)
        if: needs.determine-version.outputs.is-beta != 'true'
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-backend:latest ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-backend:${{ needs.determine-version.outputs.image-tag }}

  build-and-push-frontend:
    needs: determine-version
    if: needs.determine-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # Utiliser le tag (vérifié qu'il pointe vers master)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-frontend
          tags: |
            type=raw,value=${{ needs.determine-version.outputs.image-tag }}
          labels: |
            org.opencontainers.image.title=lumy-home-frontend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/lumy-home-frontend:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_HUB_USERNAME }}/lumy-home-frontend:buildcache,mode=max

      - name: Tag as latest (stable only)
        if: needs.determine-version.outputs.is-beta != 'true'
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-frontend:latest ${{ env.DOCKER_HUB_USERNAME }}/lumy-home-frontend:${{ needs.determine-version.outputs.image-tag }}
