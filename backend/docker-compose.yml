version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homehub-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_PATH=/app/data/homehub.db
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_CLIENT_ID=homehub-backend
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - homehub-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: homehub-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - homehub-network

networks:
  homehub-network:
    driver: bridge

