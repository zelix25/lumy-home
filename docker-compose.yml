services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: homehub-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - homehub-network

  zigbee2mqtt:
      image: koenkk/zigbee2mqtt
      container_name: zigbee2mqtt
      restart: unless-stopped
      depends_on:
        - mosquitto
      volumes:
        - ./data:/app/data
        - /run/udev:/run/udev:ro
      ports:
        - "8080:8080" # Port de l'interface web Zigbee2MQTT
      environment:
        - TZ=Europe/Paris
      devices:
        - /dev/ttyUSB0:/dev/ttyUSB0 # adapter selon ton coordinator Zigbee

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homehub-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://frontend:80
      - DATABASE_PATH=/app/data/homehub.db
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_USERNAME=change-me
      - MQTT_PASSWORD=change-me
      - MQTT_CLIENT_ID=homehub-backend
      - MQTT_RECONNECT_PERIOD=5000
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - homehub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homehub-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - homehub-network

  ollama:
    image: ollama/ollama:latest
    container_name: gemma3-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./gemma3_data:/root/.ollama  # stockage des modèles
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull gemma3 &&
        wait
      "

networks:
  homehub-network:
    driver: bridge

