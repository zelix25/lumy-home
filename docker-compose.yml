services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: homehub-mosquitto
    # Ports retirés - communication uniquement via réseau Docker privé
    # Pour le développement local, décommentez les lignes suivantes :
    # ports:
    #   - "1883:1883"
    #   - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - homehub-network

  zigbee2mqtt:
      image: koenkk/zigbee2mqtt
      container_name: zigbee2mqtt
      restart: unless-stopped
      depends_on:
        - mosquitto
      volumes:
        - ./data:/app/data
        - /run/udev:/run/udev:ro
      ports:
        - "8080:8080" # Port de l'interface web Zigbee2MQTT
      environment:
        - TZ=Europe/Paris
      devices:
        - /dev/ttyUSB0:/dev/ttyUSB0 # adapter selon ton coordinator Zigbee

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    # Port retiré - communication uniquement via réseau Docker privé
    # Pour le développement local, décommentez la ligne suivante :
    # ports:
    #   - "3000:3000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - homehub-network
      - frontend-backend
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend:80}
      - DATABASE_PATH=${DATABASE_PATH:-data/homehub.db}
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-homehub-backend}
      - MQTT_RECONNECT_PERIOD=${MQTT_RECONNECT_PERIOD:-5000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLAMA_API_URL=${LLAMA_API_URL:-http://ollama:11434}
      - LLAMA_MODEL=${LLAMA_MODEL:-gemma3}
      - USE_LOCAL_LLAMA=${USE_LOCAL_LLAMA:-true}
      - JWT_SECRET=${JWT_SECRET:-homehub-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ENABLE_LOCAL_MODE=${ENABLE_LOCAL_MODE:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Plus besoin de VITE_API_URL et VITE_WS_URL - utilisation de chemins relatifs
      # args:
      #   - VITE_API_URL=${VITE_API_URL:-}
      #   - VITE_WS_URL=${VITE_WS_URL:-}
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - homehub-network
      - frontend-backend
    env_file:
      - ./frontend/.env

  ollama:
    image: ollama/ollama:latest
    container_name: gemma3-local
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./gemma3_data:/root/.ollama  # stockage des modèles
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull gemma3 &&
        wait
      "

networks:
  homehub-network:
    external: true
    driver: bridge
  frontend-backend:
    driver: bridge
    internal: true
