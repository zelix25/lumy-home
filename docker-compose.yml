services:

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    # Ports retirés - communication uniquement via réseau Docker privé
    # Pour le développement local, décommentez les lignes suivantes :
    # ports:
    #   - "1883:1883"
    #   - "9001:9001"
    volumes:
      - ./data/mosquitto/config:/mosquitto/config
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - lumy-network

  zigbee2mqtt:
      image: koenkk/zigbee2mqtt
      container_name: zigbee2mqtt
      restart: unless-stopped
      depends_on:
        - mosquitto
      volumes:
        - ./data/zigbee2mqtt:/app/data
        - /run/udev:/run/udev:ro
      ports:
        - "8080:8080" # Port de l'interface web Zigbee2MQTT
      environment:
        - TZ=Europe/Paris
      devices:
        - /dev/ttyUSB0:/dev/ttyUSB0 # adapter selon ton coordinator Zigbee
      networks:
        - lumy-network

  backend:
    #build:
      #context: ./backend
      #dockerfile: Dockerfile
    image: zelix25/lumy-home-backend:latest
    container_name: lumy-backend
    # Port retiré - communication uniquement via réseau Docker privé
    # Pour le développement local, décommentez la ligne suivante :
    # ports:
    #   - "3000:3000"
    env_file:
      - ./data/backend/.env
    volumes:
      - ./data/backend/data:/app/data
      - ./data/backend/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - lumy-network
      - lumy-frontend-backend
  frontend:
    #build:
      #context: ./frontend
      #dockerfile: Dockerfile
    image: zelix25/lumy-home-frontend:latest
    container_name: lumy-frontend

    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lumy-network
      - lumy-frontend-backend

networks:
  lumy-network:
    name: lumy-network
    driver: bridge
  lumy-frontend-backend:
    name: lumy-frontend-backend
    driver: bridge
    internal: true
